name: Tango A/A
on: [pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  control:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: hb
            revision: ed51d202cfd0c29372d3ee056eb0dc715688a410
          - engine: hr
            revision: a41546bfd215012dd743ca1d313d00a01074a5c0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./
        with:
          engine: ${{ matrix.engine }}
          baseline: ${{ matrix.revision }}
          candidate: ${{ matrix.revision }}
