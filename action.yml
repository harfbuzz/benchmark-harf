name: Paired shaping benchmark
description: Compare a shaping change with its base and optionally with the other engine using Tango
inputs:
  engine:
    description: hb for native HarfBuzz or hr for the HarfRust C API
    required: true
  baseline:
    description: Baseline commit SHA of the selected engine
    required: true
  candidate:
    description: Candidate commit SHA. Use the baseline SHA for an A/A control.
    required: true
  peer-ref:
    description: Optional ref of the other engine to compare with the candidate (main or a commit SHA)
    default: ''
runs:
  using: composite
  steps:
    - name: Check inputs
      shell: bash
      env:
        ENGINE: ${{ inputs.engine }}
        BASE: ${{ inputs.baseline }}
        CANDIDATE: ${{ inputs.candidate }}
      run: |
        [[ $ENGINE == hb || $ENGINE == hr ]]
        [[ $BASE =~ ^[[:xdigit:]]{40}$ && $CANDIDATE =~ ^[[:xdigit:]]{40}$ ]]

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ inputs.engine == 'hb' && 'harfbuzz/harfbuzz' || 'harfbuzz/harfrust' }}
        ref: ${{ inputs.baseline }}
        path: tango-base
        persist-credentials: false

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      if: inputs.candidate != inputs.baseline
      with:
        repository: ${{ inputs.engine == 'hb' && 'harfbuzz/harfbuzz' || 'harfbuzz/harfrust' }}
        ref: ${{ inputs.candidate }}
        path: tango-candidate
        persist-credentials: false

    - name: Check out the other engine
      if: inputs.peer-ref != ''
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ inputs.engine == 'hb' && 'harfbuzz/harfrust' || 'harfbuzz/harfbuzz' }}
        ref: ${{ inputs.peer-ref }}
        path: tango-peer
        persist-credentials: false

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: harfbuzz/harfbuzz
        ref: ed51d202cfd0c29372d3ee056eb0dc715688a410
        path: tango-corpus
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          /perf/fonts/
          /perf/texts/
          /test/subset/data/fonts/SourceSerifVariable-Roman.ttf
        persist-credentials: false

    - name: Install HarfBuzz build tools
      if: inputs.engine == 'hb' || inputs.peer-ref != ''
      shell: bash
      run: sudo apt-get update -qq && sudo apt-get install -y meson ninja-build

    - name: Build and compare
      shell: bash
      env:
        ENGINE: ${{ inputs.engine }}
        PEER_REF: ${{ inputs.peer-ref }}
        BASE: ${{ inputs.baseline }}
        CANDIDATE: ${{ inputs.candidate }}
      run: |
        out=$(mktemp -d "$RUNNER_TEMP/tango.XXXXXXXX")
        "$GITHUB_ACTION_PATH/tango/build-engine.sh" "$ENGINE" tango-base "$out/base"
        baseline="$out/base/tango/release/benchmark-harf-tango"
        candidate="$baseline"
        if [[ "$BASE" != "$CANDIDATE" ]]; then
          "$GITHUB_ACTION_PATH/tango/build-engine.sh" "$ENGINE" tango-candidate "$out/candidate"
          candidate="$out/candidate/tango/release/benchmark-harf-tango"
        fi
        if [[ "$ENGINE" == hb ]]; then
          engine_name=HarfBuzz
          peer=hr
          peer_name=HarfRust
        else
          engine_name=HarfRust
          peer=hb
          peer_name=HarfBuzz
        fi
        # Link the actual revisions in the job summary and the archived tables.
        label() {
          printf '[%s %s `%.12s`](https://github.com/harfbuzz/%s/commit/%s)' "$1" "$2" "$3" "${1,,}" "$3"
        }
        candidate_label=$(label "$engine_name" candidate "$CANDIDATE")
        compare="$GITHUB_ACTION_PATH/tango/compare.py"
        python3 "$compare" "$baseline" "$candidate" tango-corpus tango-results/same-engine \
          --title "Same-engine comparison" --labels "$(label "$engine_name" base "$BASE")" "$candidate_label"

        if [[ -n "$PEER_REF" ]]; then
          peer_sha=$(git -C tango-peer rev-parse HEAD)
          "$GITHUB_ACTION_PATH/tango/build-engine.sh" "$peer" tango-peer "$out/peer"
          python3 "$compare" "$out/peer/tango/release/benchmark-harf-tango" "$candidate" \
            tango-corpus tango-results/cross-engine --title "Cross-engine comparison" \
            --labels "$(label "$peer_name" reference "$peer_sha")" "$candidate_label"
        fi

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: tango-${{ inputs.engine }}-${{ github.run_attempt }}
        path: tango-results
